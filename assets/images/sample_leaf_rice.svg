<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" width="100%" height="100%">
  <defs>
    <linearGradient id="leafBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14532D"/>
      <stop offset="100%" stop-color="#052E16"/>
    </linearGradient>
    <linearGradient id="riceLeafGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="50%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
    <linearGradient id="lesionGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FEF08A"/>
      <stop offset="35%" stop-color="#F59E0B"/>
      <stop offset="70%" stop-color="#B45309"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
    <linearGradient id="blastLesion" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#78350F"/>
      <stop offset="20%" stop-color="#D97706"/>
      <stop offset="50%" stop-color="#E2E8F0"/>
      <stop offset="80%" stop-color="#D97706"/>
      <stop offset="100%" stop-color="#78350F"/>
    </linearGradient>
  </defs>

  <!-- Field Background -->
  <rect width="320" height="240" rx="16" fill="url(#leafBgGrad)"/>

  <!-- Scanning grid overlay -->
  <line x1="20" y1="60" x2="300" y2="60" stroke="#22C55E" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>
  <line x1="20" y1="120" x2="300" y2="120" stroke="#22C55E" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>
  <line x1="20" y1="180" x2="300" y2="180" stroke="#22C55E" stroke-width="0.5" stroke-dasharray="4,4" opacity="0.2"/>

  <!-- Main Diagonal Rice Leaf Blade -->
  <path d="M 20,220 C 60,180 120,130 180,80 C 230,40 280,18 300,12 C 290,35 250,90 200,140 C 140,200 80,235 20,220 Z" 
        fill="url(#riceLeafGrad)"/>

  <!-- Central Leaf Vein -->
  <path d="M 20,220 C 100,160 200,80 300,12" stroke="#86EFAC" stroke-width="2" fill="none" opacity="0.7"/>

  <!-- Parallel Venation Lines -->
  <path d="M 35,215 C 105,160 195,85 285,25" stroke="#16A34A" stroke-width="0.8" fill="none"/>
  <path d="M 45,225 C 115,170 205,95 270,45" stroke="#15803D" stroke-width="0.8" fill="none"/>

  <!-- Bacterial Leaf Blight Lesion (Wavy margin along upper edge) -->
  <path d="M 170,88 C 190,75 220,50 260,32 C 275,25 290,17 300,12 C 285,26 265,48 245,66 C 220,88 190,105 170,88 Z" 
        fill="url(#lesionGrad)" opacity="0.95"/>

  <!-- Blast Spindle-Shaped Eye Lesion 1 -->
  <path d="M 120,145 Q 140,128 160,120 Q 140,142 120,145 Z" fill="url(#blastLesion)"/>
  <ellipse cx="140" cy="133" rx="4" ry="2" fill="#F8FAFC" transform="rotate(-30 140 133)"/>

  <!-- Blast Spindle-Shaped Eye Lesion 2 -->
  <path d="M 75,182 Q 95,168 112,160 Q 95,180 75,182 Z" fill="url(#blastLesion)"/>
  <ellipse cx="94" cy="171" rx="3" ry="1.5" fill="#F8FAFC" transform="rotate(-25 94 171)"/>

  <!-- Brown spots (smaller necrotic flecks) -->
  <ellipse cx="165" cy="115" rx="3.5" ry="2" fill="#78350F"/>
  <ellipse cx="180" cy="102" rx="2.5" ry="1.5" fill="#B45309"/>
  <ellipse cx="105" cy="155" rx="3" ry="2" fill="#78350F"/>

  <!-- Diagnostic Bounding Box Indicator -->
  <g stroke="#22C55E" stroke-width="2" fill="none">
    <!-- Top-left corner -->
    <path d="M 130,55 L 145,55 M 130,55 L 130,70"/>
    <!-- Top-right corner -->
    <path d="M 280,10 L 265,10 M 280,10 L 280,25"/>
    <!-- Bottom-left corner -->
    <path d="M 130,165 L 145,165 M 130,165 L 130,150"/>
    <!-- Bottom-right corner -->
    <path d="M 280,120 L 265,120 M 280,120 L 280,105"/>
  </g>

  <!-- Diagnostic label badge -->
  <rect x="18" y="16" width="128" height="26" rx="6" fill="rgba(15, 23, 42, 0.85)" stroke="#22C55E" stroke-width="1"/>
  <circle cx="28" cy="29" r="4" fill="#22C55E"/>
  <text x="38" y="33" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="11" font-weight="600">Paddy Leaf Sample</text>
</svg>
