<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 220" width="100%" height="100%">
  <defs>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#E0F2FE"/>
      <stop offset="60%" stop-color="#BAE6FD"/>
      <stop offset="100%" stop-color="#DCFCE7"/>
    </linearGradient>
    <linearGradient id="sunGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="100%" stop-color="#F59E0B"/>
    </linearGradient>
    <linearGradient id="fieldHill1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC"/>
      <stop offset="100%" stop-color="#22C55E"/>
    </linearGradient>
    <linearGradient id="fieldHill2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <!-- Sky Background -->
  <rect width="360" height="220" rx="16" fill="url(#skyGrad)"/>

  <!-- Golden Morning Sun -->
  <circle cx="280" cy="50" r="32" fill="url(#sunGrad)" opacity="0.85"/>
  <circle cx="280" cy="50" r="42" fill="#FEF08A" opacity="0.25"/>

  <!-- Gentle Birds in the distance -->
  <path d="M 120,45 Q 125,40 130,45 Q 135,40 140,45" stroke="#0284C7" stroke-width="1.5" fill="none"/>
  <path d="M 150,55 Q 154,51 158,55 Q 162,51 166,55" stroke="#0284C7" stroke-width="1.2" fill="none"/>

  <!-- Background Rolling Farm Hills -->
  <path d="M 0,140 Q 100,100 220,130 Q 300,150 360,125 L 360,220 L 0,220 Z" fill="url(#fieldHill1)"/>
  <path d="M 0,165 Q 140,135 260,170 Q 320,185 360,160 L 360,220 L 0,220 Z" fill="url(#fieldHill2)"/>

  <!-- Farm Furrow Rows -->
  <path d="M 0,195 Q 120,175 360,205" stroke="#14532D" stroke-width="2" fill="none" opacity="0.3"/>
  <path d="M 0,210 Q 150,190 360,220" stroke="#14532D" stroke-width="2" fill="none" opacity="0.3"/>

  <!-- Farmer with Mobile Diagnostic Tool (Silhouetted/Stylized) -->
  <g transform="translate(60, 80)">
    <!-- Farmer Straw Hat -->
    <ellipse cx="60" cy="22" rx="22" ry="6" fill="#F59E0B"/>
    <path d="M 48,20 Q 60,6 72,20 Z" fill="#D97706"/>
    <!-- Head -->
    <circle cx="60" cy="28" r="9" fill="#FBBF24"/>
    <!-- Body / Shirt -->
    <path d="M 50,37 L 70,37 L 76,78 L 44,78 Z" fill="#0284C7"/>
    <!-- Overalls / Scarf -->
    <path d="M 54,37 L 66,37 L 64,55 L 56,55 Z" fill="#DC2626"/>
    <!-- Left Arm Holding Phone Scanner -->
    <path d="M 50,42 L 32,58 L 38,62" stroke="#0284C7" stroke-width="6" stroke-linecap="round"/>
    <!-- Mobile Device in hand -->
    <rect x="25" y="46" width="12" height="20" rx="3" fill="#1E293B"/>
    <rect x="27" y="48" width="8" height="14" rx="1" fill="#22C55E"/>
    <!-- Scanner Beam projecting towards crops -->
    <polygon points="27,55 0,85 15,95 33,60" fill="#4ADE80" opacity="0.45"/>

    <!-- Right Arm on waist -->
    <path d="M 70,42 L 80,56 L 74,66" stroke="#0284C7" stroke-width="5" stroke-linecap="round"/>
    <!-- Pants -->
    <path d="M 44,78 L 44,115 L 56,115 L 58,86 L 62,86 L 64,115 L 76,115 L 76,78 Z" fill="#64748B"/>
    <!-- Boots -->
    <path d="M 38,114 L 56,114 L 56,120 L 36,120 Z" fill="#451A03"/>
    <path d="M 64,114 L 82,114 L 84,120 L 64,120 Z" fill="#451A03"/>
  </g>

  <!-- Crops in Foreground (Wheat and Rice stalks on side) -->
  <g stroke="#15803D" stroke-width="2.5" fill="none">
    <path d="M 15,220 Q 20,170 30,140"/>
    <path d="M 28,220 Q 32,180 45,150"/>
    <path d="M 310,220 Q 305,170 295,135"/>
    <path d="M 330,220 Q 325,175 315,145"/>
    <path d="M 345,220 Q 340,165 330,130"/>
  </g>
  <!-- Leaves on foreground stalks -->
  <path d="M 30,150 Q 15,135 5,145" stroke="#22C55E" stroke-width="3" fill="none"/>
  <path d="M 295,145 Q 315,130 330,140" stroke="#22C55E" stroke-width="3" fill="none"/>
  <ellipse cx="295" cy="132" rx="4" ry="8" fill="#FBBF24" transform="rotate(-15 295 132)"/>
  <ellipse cx="315" cy="142" rx="4" ry="8" fill="#FBBF24" transform="rotate(-15 315 142)"/>
</svg>
