<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="riceBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ECFDF5"/>
      <stop offset="100%" stop-color="#D1FAE5"/>
    </linearGradient>
    <linearGradient id="riceGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="riceStem" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#15803D"/>
    </linearGradient>
  </defs>

  <rect width="200" height="200" rx="24" fill="url(#riceBg)"/>

  <!-- Water Ripple at base -->
  <ellipse cx="100" cy="175" rx="70" ry="12" fill="#A7F3D0" opacity="0.6"/>
  <ellipse cx="100" cy="177" rx="50" ry="7" fill="#6EE7B7" opacity="0.4"/>

  <!-- Rice Paddy Stalks -->
  <!-- Main stem curving slightly right -->
  <path d="M 92,175 Q 96,110 115,55" fill="none" stroke="url(#riceStem)" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Secondary stem -->
  <path d="M 85,175 Q 75,120 70,75" fill="none" stroke="url(#riceStem)" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Third stem -->
  <path d="M 108,175 Q 120,130 135,90" fill="none" stroke="url(#riceStem)" stroke-width="3.5" stroke-linecap="round"/>

  <!-- Rice Leaves (long, slender blades) -->
  <path d="M 88,140 Q 50,110 32,125 Q 60,135 88,145 Z" fill="#16A34A"/>
  <path d="M 102,130 Q 145,105 168,120 Q 140,128 102,135 Z" fill="#22C55E"/>
  <path d="M 94,105 Q 60,75 42,90 Q 70,98 94,110 Z" fill="#15803D"/>

  <!-- Drooping Panicle Grains (Main Stalk) -->
  <g fill="url(#riceGold)" stroke="#B45309" stroke-width="0.8">
    <!-- Grains cascading downwards -->
    <ellipse cx="118" cy="52" rx="4.5" ry="8" transform="rotate(25 118 52)"/>
    <ellipse cx="126" cy="62" rx="4.5" ry="8" transform="rotate(35 126 62)"/>
    <ellipse cx="132" cy="74" rx="4.5" ry="8" transform="rotate(45 132 74)"/>
    <ellipse cx="136" cy="88" rx="4.5" ry="8" transform="rotate(55 136 88)"/>
    <ellipse cx="138" cy="102" rx="4.5" ry="8" transform="rotate(65 138 102)"/>
    <ellipse cx="136" cy="116" rx="4.5" ry="8" transform="rotate(75 136 116)"/>
    
    <!-- Secondary grains branch -->
    <ellipse cx="112" cy="60" rx="4" ry="7" transform="rotate(15 112 60)"/>
    <ellipse cx="120" cy="72" rx="4" ry="7" transform="rotate(25 120 72)"/>
    <ellipse cx="125" cy="85" rx="4" ry="7" transform="rotate(35 125 85)"/>

    <!-- Left panicle grains -->
    <ellipse cx="68" cy="70" rx="4" ry="7" transform="rotate(-30 68 70)"/>
    <ellipse cx="62" cy="82" rx="4" ry="7" transform="rotate(-40 62 82)"/>
    <ellipse cx="58" cy="95" rx="4" ry="7" transform="rotate(-50 58 95)"/>
  </g>

  <!-- Rice badge text / banner -->
  <rect x="52" y="14" width="96" height="26" rx="13" fill="#15803D"/>
  <text x="100" y="31" fill="#FFFFFF" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" text-anchor="middle">RICE (धान)</text>
</svg>
