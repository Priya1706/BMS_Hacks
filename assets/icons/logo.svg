<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D"/>
      <stop offset="100%" stop-color="#0E4423"/>
    </linearGradient>
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ADE80"/>
      <stop offset="100%" stop-color="#16A34A"/>
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22C55E"/>
      <stop offset="100%" stop-color="#86EFAC"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#052e16" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Shield -->
  <path d="M 50,6 C 68,6 88,14 88,32 C 88,64 56,86 50,94 C 44,86 12,64 12,32 C 12,14 32,6 50,6 Z" 
        fill="url(#shieldGrad)" filter="url(#glow)"/>

  <!-- Shield Inner Border Highlight -->
  <path d="M 50,11 C 65,11 83,18 83,33 C 83,61 55,81 50,88 C 45,81 17,61 17,33 C 17,18 35,11 50,11 Z" 
        fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="2"/>

  <!-- Diagnostic Scan Circle Element -->
  <circle cx="50" cy="46" r="28" fill="none" stroke="#22C55E" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.6"/>

  <!-- Central Sprout / Healthy Leaf -->
  <!-- Left Leaf -->
  <path d="M 50,66 C 40,56 30,46 32,32 C 34,20 48,22 50,42 Z" fill="url(#sproutGrad)"/>
  <!-- Right Leaf -->
  <path d="M 50,66 C 60,56 70,46 68,32 C 66,20 52,22 50,42 Z" fill="url(#leafGrad)"/>

  <!-- Leaf Central Spine / Diagnostic Line -->
  <path d="M 50,70 L 50,26" stroke="#FFFFFF" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left Side Vein -->
  <path d="M 50,48 Q 42,42 38,36" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>
  <!-- Right Side Vein -->
  <path d="M 50,42 Q 58,36 62,32" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round" fill="none"/>

  <!-- Golden Root Base / Harvest Foundation -->
  <path d="M 44,70 Q 50,75 56,70 Q 58,78 50,82 Q 42,78 44,70 Z" fill="#F59E0B"/>
  <circle cx="50" cy="22" r="3" fill="#FDE047"/>
</svg>
